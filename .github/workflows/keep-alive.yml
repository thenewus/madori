# Keeps the free-tier Supabase project from pausing after 7 idle days.
# Goes into the thenewus/madori repo as .github/workflows/keep-alive.yml.
# Needs the repo secret SUPABASE_ANON_KEY (the app's public anon key).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */2 * *' # every 2 days, 03:17 UTC
  workflow_dispatch: # "Run workflow" button for a manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call account_was_deleted with a dummy id (a real database query)
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o out.txt -w '%{http_code}' -m 60 -X POST \
            'https://ffbbfdybnrjmevfnkrsu.supabase.co/rest/v1/rpc/account_was_deleted' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{"uid":"00000000-0000-0000-0000-000000000000"}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = 200
